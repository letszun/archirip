name: Apply ChatGPT app update

on:
  push:
    paths:
      - 'chatgpt-update.tar.gz.b64'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply packaged update
        shell: bash
        run: |
          if [ ! -f chatgpt-update.tar.gz.b64 ]; then
            echo "No update payload; nothing to do."
            exit 0
          fi
          base64 -d chatgpt-update.tar.gz.b64 > /tmp/chatgpt-update.tar.gz
          tar -xzf /tmp/chatgpt-update.tar.gz -C .
          rm -f chatgpt-update.tar.gz.b64

      - name: Commit applied update
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Reading Archive app update"
          git push

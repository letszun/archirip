name: Apply ChatGPT app update

on:
  push:
    paths:
      - 'chatgpt-update.ready'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payloads = {
              '.chatgpt/index.html.gz.b64': 'index.html',
              '.chatgpt/app-v12.js.gz.b64': 'app-v12.js',
              '.chatgpt/books-v12.json.gz.b64': 'books-v12.json',
          }

          for source, target in payloads.items():
              source_path = Path(source)
              if not source_path.exists():
                  raise SystemExit(f'Missing staged payload: {source}')
              encoded = source_path.read_text(encoding='utf-8').strip()
              decoded = gzip.decompress(base64.b64decode(encoded))
              Path(target).write_bytes(decoded)
              print(f'Wrote {target}: {len(decoded)} bytes')

          Path('chatgpt-update.ready').unlink(missing_ok=True)
          Path('chatgpt-update.tar.gz.b64').unlink(missing_ok=True)
          for source in payloads:
              Path(source).unlink(missing_ok=True)
          try:
              Path('.chatgpt').rmdir()
          except OSError:
              pass
          PY

      - name: Commit applied update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Reading Archive to v12"
          git push
